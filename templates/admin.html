<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Prensa Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
            <h2 class="text-primary fw-bold">Panel de Carga - Prensa Taller</h2>
            <a href="/" class="btn btn-outline-secondary">Ver Sitio Web</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="m-0">Redactar Nueva Publicación</h5>
            </div>
            <div class="card-body">
                <form action="/publicar" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Título de la nota</label>
                        <input type="text" name="titulo" class="form-control" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Categoría / Etiqueta</label>
                            <select name="categoria" class="form-select">
                                <option value="DESAFÍO ECO / EVENTOS">DESAFÍO ECO / EVENTOS</option>
                                <option value="AUTOMATIZACIÓN Y ROBÓTICA">AUTOMATIZACIÓN Y ROBÓTICA</option>
                                <option value="PROYECTOS DE AULA">PROYECTOS DE AULA</option>
                                <option value="NOVEDADES INSTITUCIONALES">NOVEDADES INSTITUCIONALES</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de publicación</label>
                            <input type="text" name="fecha" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Imagen del Proyecto / Actividad</label>
                        <input type="file" name="imagen" class="form-control" accept="image/*">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cuerpo de la Noticia</label>
                        <textarea name="contenido" class="form-control" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 fw-bold">Publicar Noticia</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
